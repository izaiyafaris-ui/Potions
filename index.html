<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14111c">
<title>Moonroot Apothecary</title>
<style>
:root{--bg:#14111c;--panel:#211b2b;--panel2:#2b2238;--line:#4b3d5b;--text:#f8f3ff;--muted:#bcb0c9;--purple:#8d5bd2;--gold:#efc75b;--green:#82df98;--red:#ff8795;--paper:#f6e9c8;--ink:#3c3028}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
#app{height:100%;max-width:620px;margin:auto;display:flex;flex-direction:column}
header{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:20px;font-weight:850}.money{color:var(--gold);background:#33291a;border:1px solid #66532c;border-radius:99px;padding:7px 12px;font-weight:850}
.clock{flex:0 0 54px;background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:8px 12px;margin-bottom:8px}
.clockline{display:flex;justify-content:space-between;align-items:center}.time{font-size:17px;font-weight:850}.phase{font-size:11px;color:var(--muted)}
.bar{height:5px;background:#110e16;border-radius:99px;margin-top:6px}.fill{height:100%;width:4%;background:var(--purple);border-radius:99px}
#screen{flex:1;min-height:0;position:relative}
.view{height:100%;display:flex;flex-direction:column;gap:8px}
.step{font-size:12px;color:#d4c8df;font-weight:850;letter-spacing:.4px;text-transform:uppercase}
.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:12px}
.customer{display:flex;gap:11px;align-items:center;min-height:91px}
.avatar{width:58px;height:58px;flex:0 0 58px;border-radius:50%;background:#d99b70;border:4px solid #5a3c37;position:relative}.avatar:before{content:"";position:absolute;left:5px;top:-6px;width:46px;height:25px;border-radius:50%;background:#4c2b32}
.speech{background:#f7f1fb;color:#2e2634;border-radius:13px;padding:9px 11px;font-size:12px;line-height:1.32;flex:1}.speech b{display:block;margin-bottom:3px}
.instruction{background:#2b2238;border-color:#5c4a6e;font-size:14px;line-height:1.35}.instruction strong{color:#fff}
.boardLayout{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.zone{position:relative;background:#19151f;border:2px dashed #5a4b66;border-radius:17px;min-height:0;padding:10px}
.zone h3{margin:0 0 5px;font-size:13px}.zone p{margin:0;color:var(--muted);font-size:11px;line-height:1.35}
.zone.active{border-color:#9a70d7;background:#21192c}
.order{width:122px;height:86px;background:var(--paper);color:var(--ink);border:2px solid #d2b981;border-radius:10px;padding:9px;font-size:12px;font-weight:800;position:absolute;z-index:20;box-shadow:0 8px 15px #0005}
.order small{display:block;font-weight:500;margin-top:4px}
.order.start{left:50%;top:50%;transform:translate(-50%,-50%)}
.boardpaper{background:#9a6a43;border:6px solid #593a29;border-radius:8px;color:#f5d6ae;padding:10px;line-height:1.4;font-size:11px;height:calc(100% - 26px);min-height:180px}.boardpaper b{font-size:13px}
.hintcenter{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#8e8199;font-size:11px}
.full{height:100%;display:flex;flex-direction:column;gap:8px}
.deliveryTop{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:100%}
.itemsZone,.customerZone{position:relative;min-height:0}
.itemsZone{background:#19151f;border:2px dashed #5a4b66;border-radius:17px;padding:10px}
.customerZone{background:#21192c;border:2px solid #9a70d7;border-radius:17px;padding:10px}
.customerMini{display:flex;align-items:center;gap:8px;padding:6px 0 10px}.customerMini .avatar{width:44px;height:44px;flex-basis:44px}.customerMini .avatar:before{width:35px;height:19px}
.target{height:calc(100% - 62px);border:2px dashed #b28be2;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#cbb9d9;font-size:12px;padding:10px}
.target.good{border-color:var(--gold);color:#eed48b}
.item{position:absolute;z-index:30;touch-action:none;user-select:none;box-shadow:0 8px 14px #0005}
.potion{width:70px;height:78px;border-radius:24px 24px 18px 18px;background:linear-gradient(#ad7dde,#674095);border:3px solid #d0b1ef;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:27px}.potion:before{content:"";position:absolute;top:-12px;width:32px;height:17px;background:#70482f;border:2px solid #4c3024;border-radius:5px}
.bill{width:88px;background:#fff9e8;color:var(--ink);border:2px solid #d5c28b;border-radius:9px;padding:8px;font-size:11px;font-weight:850}
.deliveryOrder{width:105px;min-height:70px;background:var(--paper);color:var(--ink);border:2px solid #d2b981;border-radius:9px;padding:8px;font-size:11px;font-weight:800}
.delivered{position:relative!important;left:auto!important;top:auto!important;transform:none!important;margin:4px;width:auto!important;height:auto!important}
.deliveryStack{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
.deliveryStack .item{position:relative!important;left:auto!important;top:auto!important;transform:none!important;margin:5px}
.paymentIntro{font-size:13px;color:var(--muted);line-height:1.35}
.tray{position:relative;flex:1;min-height:0;background:#19151f;border:2px dashed #8d6fba;border-radius:17px;overflow:hidden}
.trayLabel{text-align:center;color:#897d93;font-size:11px;margin-top:8px}
.coin,.herb{position:absolute;z-index:30;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;box-shadow:0 7px 12px #0005}
.coin{width:62px;height:62px;border-radius:50%;border:3px solid #ffffff33;font-size:11px}.c10{background:#b99b4e}.c5{background:#909198}
.herb{width:78px;height:55px;border-radius:12px;background:#537c5a;border:2px solid #7da682;font-size:11px}
.bottom{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;padding:12px 8px;background:#342a40;color:white;font-weight:850}.primary{background:var(--purple)}.btn:disabled{opacity:.35}
.message{min-height:23px;text-align:center;font-size:12px;font-weight:750}.good{color:var(--green)}.bad{color:var(--red)}
.complete{display:flex;flex:1;align-items:center;justify-content:center;text-align:center}.completeBox{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:100%}.completeBox h2{margin:0 0 8px}.completeBox p{color:var(--muted);font-size:13px;line-height:1.4}
.modal{position:fixed;inset:0;background:#08050dcc;z-index:100;display:flex;align-items:flex-end;padding:14px}.sheet{width:min(600px,100%);margin:auto;background:#211a2d;border:1px solid #514361;border-radius:21px;padding:18px}.sheet h2{margin:0 0 7px}.sheet p{font-size:14px;color:#c8bdd1;line-height:1.45}.sheet button{width:100%;background:var(--purple);color:white;border:0;border-radius:14px;padding:14px;font-weight:900}
.hidden{display:none!important}
@media(max-width:390px){header{height:48px;flex-basis:48px}.brand{font-size:18px}.clock{flex-basis:50px}.boardLayout,.deliveryTop{gap:6px}.card{padding:9px}.customer{min-height:82px}.speech{font-size:11px}.zone{padding:8px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">🧪 Moonroot Apothecary</div><div class="money">💰 <span id="money">40</span>g</div></header>
<div class="clock"><div class="clockline"><span class="time" id="time">7:15 AM</span><span class="phase" id="phase">New customer</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="screen"></div>
</div>

<div class="modal" id="modal"><div class="sheet"><h2>Emily has an order</h2><p>She will describe her problem, but she will <b>not</b> tell you the potion she needs. File her order, prepare the correct potion, then serve her when she returns.</p><button id="start">Start Selling</button></div></div>

<script>
(() => {
const $=id=>document.getElementById(id), screen=$('screen');
let phase=0,time=435,money=40,drag=null,dx=0,dy=0,sorted=0,total=0;

function clock(){let h=Math.floor(time/60),m=time%60,ap=h>=720?'PM':'AM',hh=((h+11)%12)+1;$('time').textContent=`${hh}:${String(m).padStart(2,'0')} ${ap}`;$('fill').style.width=Math.max(4,Math.min(100,((time-435)/765)*100))+'%';}
function msg(t,c=''){let e=$('message');if(e){e.textContent=t;e.className='message '+c}}
function base(){
 return `<div class="view"><div class="bottom"><button class="btn" id="reset">Reset Test</button><button class="btn primary" id="advance">Advance Time</button></div></div>`;
}
function customerHtml(text){return `<div class="card customer"><div class="avatar"></div><div class="speech"><b>Emily</b>${text}</div></div>`}
function makeDraggable(el){
 el.addEventListener('pointerdown',e=>{
   if(el.dataset.locked==='1')return;
   e.preventDefault();drag=el;el.setPointerCapture?.(e.pointerId);
   const r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;el.style.transform='none';
 });
}
function move(e){
 if(!drag)return;
 const parent=drag.offsetParent||document.body,pr=parent.getBoundingClientRect();
 drag.style.left=(e.clientX-pr.left-dx)+'px';drag.style.top=(e.clientY-pr.top-dy)+'px';
}
function stop(){if(drag){const el=drag;drag=null;drop(el)}}
screen.addEventListener('pointermove',move);screen.addEventListener('pointerup',stop);screen.addEventListener('pointercancel',()=>drag=null);
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return !(A.right<B.left||A.left>B.right||A.bottom<B.top||A.top>B.bottom)}
function object(cls,html,parent){
 let e=document.createElement('div');e.className='item '+cls;e.innerHTML=html;$(parent).appendChild(e);makeDraggable(e);return e;
}
function renderOrder(){
 screen.innerHTML=`<div class="view">
  <div class="step">Step 1 of 3 • File the order</div>
  ${customerHtml(`“I’ve been having terrible trouble sleeping. My head just won’t quiet down. I’ll come back at <b>8:00 PM</b>.”`)}
  <div class="card instruction"><strong>Drag the order</strong> from the counter to the Delivery Board. The order will reveal the details you need.</div>
  <div class="boardLayout">
   <div class="zone active" id="counter"><h3>Your Counter</h3><p>Orders left by customers appear here.</p><div class="hintcenter">Drag the paper →</div></div>
   <div class="zone" id="board"><h3>Delivery Board</h3><div class="hintcenter">Drop order here</div></div>
  </div>
  <div class="message" id="message"></div>
  <div class="bottom"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Advance Time</button></div>
 </div>`;
 let o=object('order','📜 ORDER #12<small>Emily</small>','counter');o.dataset.kind='order';o.classList.add('start');
 $('reset').onclick=reset;
 msg('Drag the order to the Delivery Board.');
}
function renderFiled(){
 screen.innerHTML=`<div class="view">
 <div class="step">Order filed ✓</div>
 ${customerHtml(`“I’ll come back at <b>8:00 PM</b>.”`)}
 <div class="card instruction"><strong>Order #12</strong><br>Return: 8:00 PM<br>Problem: “I can’t sleep. My head just won’t quiet down.”<br><br><b>Your job:</b> choose the right potion and have it ready.</div>
 <div class="card" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px">This prototype skips brewing for now.<br>Advance time to 8:00 PM to meet Emily again.</div>
 <div class="message" id="message"></div>
 <div class="bottom"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance">Advance to 8 PM</button></div>
 </div>`;
 $('reset').onclick=reset;$('advance').onclick=advance;msg('Dreamer’s Rest is the correct potion for this order.','good');
}
function renderDelivery(){
 screen.innerHTML=`<div class="view">
 <div class="step">Step 2 of 3 • Serve Emily</div>
 ${customerHtml(`“Hi! I hope you made something to help.”`)}
 <div class="card instruction"><strong>Deliver these in order:</strong> ① Potion → ② Order → ③ Bill</div>
 <div class="deliveryTop">
  <div class="itemsZone" id="items"><h3>Your Items</h3><p>Drag each item to Emily.</p></div>
  <div class="customerZone"><div class="customerMini"><div class="avatar"></div><b>Emily</b></div><div class="target" id="target">Drop the next item here</div></div>
 </div>
 <div class="message" id="message"></div>
 <div class="bottom"><button class="btn" id="reset">Reset</button><button class="btn" id="advance" disabled>Continue</button></div>
 </div>`;
 $('reset').onclick=reset;
 let p=object('potion','🧪','items');p.dataset.kind='potion';p.style.left='18%';p.style.top='52%';
 let o=object('deliveryOrder','📜<br>ORDER #12','items');o.dataset.kind='order';o.style.left='48%';o.style.top='51%';
 let b=object('bill','BILL<br>25g','items');b.dataset.kind='bill';b.style.left='25%';b.style.top='73%';
 msg('Drag the 🧪 potion to Emily first.');
}
function renderPayment(){
 screen.innerHTML=`<div class="view">
 <div class="step">Step 3 of 3 • Sort the payment</div>
 ${customerHtml(`“Thank you! Here’s your payment.”`)}
 <div class="card instruction"><strong>Drag all four pieces into the tray.</strong><br>Coins become gold. Silverleaf is kept as an item.</div>
 <div class="tray" id="tray"><div class="trayLabel">PAYMENT TRAY • DROP EVERYTHING HERE</div></div>
 <div class="message" id="message"></div>
 <div class="bottom"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Finish</button></div>
 </div>`;
 $('reset').onclick=reset;
 [['c10','10g',10],['c10','10g',10],['c5','5g',5],['herb','🌿<br>Silverleaf',0]].forEach((a,i)=>{
   let e=object(a[0],a[1],'tray');e.dataset.pay='1';e.dataset.value=a[2];e.style.left=(8+i*23)+'%';e.style.top='42%';
 });
 msg('Sort the four payment pieces into the tray.');
}
function renderComplete(){
 screen.innerHTML=`<div class="complete"><div class="completeBox"><h2>🎉 Sale complete!</h2><p>Emily received the correct potion, her order, and her bill.</p><p><b>+25g</b> added to your purse.<br>🌿 Silverleaf added to your item stash.</p><button class="btn primary" id="reset" style="width:100%">Play Again</button></div></div>`;$('reset').onclick=reset;
}
function drop(el){
 if(phase===1&&el.dataset.kind==='order'&&hit(el,$('board'))){
   phase=2;renderFiled();clock();return;
 }
 if(phase>=3&&phase<=5&&el.dataset.kind&&hit(el,$('target'))){
   let needed=['potion','order','bill'][phase-3];
   if(el.dataset.kind!==needed){msg('Not yet. The order is Potion → Order → Bill.','bad');return}
   el.dataset.locked='1';el.classList.add('delivered');$('target').appendChild(el);
   phase++;
   if(phase===4)msg('Potion delivered ✓ Now deliver the order.','good');
   if(phase===5)msg('Order delivered ✓ Now deliver the bill.','good');
   if(phase===6){msg('Everything delivered ✓ Payment incoming!','good');setTimeout(()=>{phase=7;renderPayment();clock()},250)}
   return;
 }
 if(phase===7&&el.dataset.pay&&hit(el,$('tray'))){
   el.dataset.locked='1';el.style.position='relative';el.style.left='auto';el.style.top='auto';el.style.margin='5px';$('tray').appendChild(el);
   total+=Number(el.dataset.value);sorted++;
   if(sorted===4){money+=total;$('money').textContent=money;phase=8;renderComplete();clock()}
   else msg(`${4-sorted} payment piece${4-sorted===1?'':'s'} left.`,'good');
 }
}
function advance(){
 if(phase===2){time=1200;phase=3;renderDelivery();clock()}
}
function reset(){phase=0;time=435;money=40;sorted=0;total=0;$('money').textContent=money;renderOrder();clock()}
$('start').onclick=()=>{$('modal').classList.add('hidden');phase=1;renderOrder();clock()};
renderOrder();clock();
})();
</script>
</body>
</html>
