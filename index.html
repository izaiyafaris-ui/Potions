<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#140d09">
<title>Moonroot Apothecary</title>
<style>
:root{--wood:#704329;--wood2:#4a2b1b;--wood3:#93603b;--dark:#1c110b;--cream:#ead8b5;--muted:#b39a7d;--gold:#e8bd54;--purple:#9565ce;--green:#83dc93;--red:#ff8795}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100a07;color:#f7ecd9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) 9px env(safe-area-inset-bottom)}
#app{height:100%;width:min(100%,650px);margin:auto;display:flex;flex-direction:column}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:18px}.brand small{display:block;margin-left:26px;color:#a78d73;font-size:7px;letter-spacing:1.3px}
.money{background:#322216;border:1px solid #71512c;border-radius:20px;color:#efc65b;font-weight:900;padding:7px 11px}
.hud{height:50px;flex:0 0 50px;background:#21150e;border:1px solid #513624;border-radius:13px;padding:7px 10px;margin-bottom:6px}
.hudtop{display:flex;justify-content:space-between}.time{font-size:16px;font-weight:900}.phase{font-size:10px;color:#bba38a}.bar{height:4px;background:#100905;margin-top:6px;border-radius:99px}.fill{height:100%;background:#a975d9;border-radius:99px;width:4%}
#screen{flex:1;min-height:0}
.view{height:100%;display:flex;flex-direction:column;gap:6px}
.kicker{height:15px;flex:0 0 15px;font-size:9px;letter-spacing:1.1px;color:#b99e82;text-transform:uppercase;font-weight:900}
.shop{position:relative;flex:1;min-height:0;border:4px solid #392317;border-radius:15px;overflow:hidden;background:linear-gradient(90deg,#673d26 0 12%,#75482b 12% 13%,#5b351f 13% 25%,#75482b 25% 27%,#61391f 27% 43%,#78492b 43% 45%,#5c361f 45% 62%,#75472a 62% 64%,#5d371f 64% 82%,#75482b 82% 84%,#5b351f 84%);box-shadow:inset 0 0 45px #160904,0 10px 22px #0008}
.shop:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 42px,#39201533 43px 45px)}
.roof{height:43px;background:linear-gradient(#2d1d14,#1b110c);border-bottom:4px solid #43291b;position:relative}
.sign{position:absolute;left:50%;top:7px;transform:translateX(-50%);background:#d1aa68;color:#3d281b;border:3px solid #553522;border-radius:5px;padding:4px 14px;font:900 9px Georgia,serif;letter-spacing:1px;white-space:nowrap;box-shadow:0 3px 6px #0007}
.shelf{position:absolute;left:8%;right:8%;top:53px;height:56px;border-bottom:7px solid #452a1b}
.shelf:after{content:"";position:absolute;left:0;right:0;bottom:10px;height:3px;background:#bc784d}
.bottle{position:absolute;bottom:14px;width:19px;height:29px;border-radius:5px 5px 8px 8px;background:#9d6bca;border:2px solid #d1aee7}.bottle:before{content:"";position:absolute;top:-7px;left:5px;width:7px;height:8px;background:#74492e;border-radius:2px}
.window{position:absolute;left:5%;right:5%;top:124px;height:41%;background:#130e0c;border:9px solid #3c2619;border-radius:7px;box-shadow:inset 0 0 0 3px #8a5a38,inset 0 0 25px #000;overflow:hidden}
.sky{position:absolute;inset:16px 0 0;background:linear-gradient(#1b2c46,#263d51 55%,#17231f)}
.moon{position:absolute;right:14%;top:11%;width:28px;height:28px;border-radius:50%;background:#eadba4;box-shadow:0 0 17px #f1dc9a66}
.tree{position:absolute;bottom:-3px;width:52px;height:70px;background:#111b18;border-radius:50% 50% 4px 4px}.tree:after{content:"";position:absolute;left:21px;bottom:0;width:9px;height:38px;background:#20170f}.t1{left:5%}.t2{right:4%;height:91px}.t3{left:39%;height:57px}
.customer{position:absolute;z-index:4;left:50%;bottom:-5px;transform:translateX(-50%);width:90px;text-align:center}
.head{width:52px;height:52px;margin:auto -0px -15px;border-radius:50%;background:#d99b70;border:4px solid #57373a;position:relative;z-index:2}.head:before{content:"";position:absolute;left:5px;top:-6px;width:37px;height:22px;background:#4b2b31;border-radius:50%}
.torso{width:72px;height:65px;margin:auto;background:#617795;border:4px solid #2d3b50;border-radius:32px 32px 10px 10px}
.speech{position:absolute;z-index:8;left:6%;right:6%;top:12px;background:#f5ead5;color:#35271d;border-radius:10px;padding:7px 9px;font-size:9px;line-height:1.28;box-shadow:0 5px 14px #0008}.speech b{display:block;font-size:10px;margin-bottom:2px}
.counter{position:absolute;z-index:10;left:-3%;right:-3%;bottom:0;height:26%;background:linear-gradient(#8d5938,#5d3825);border-top:8px solid #3b2519;box-shadow:0 -7px 15px #0008}
.countertop{height:12px;background:#a96b43;border-top:2px solid #c18a59;border-bottom:3px solid #44291b}
.countertext{text-align:center;color:#d9b68d;font-size:8px;letter-spacing:1.1px;font-weight:900;margin-top:15px}
.counterItem{position:absolute;z-index:30;touch-action:none;user-select:none;box-shadow:0 7px 13px #0008}
.paper{width:103px;height:69px;background:#f3e5c1;color:#392a20;border:2px solid #c8ad76;border-radius:7px;padding:8px;font-size:10px;font-weight:900}.paper small{display:block;font-size:8px;margin-top:3px;font-weight:600}
.orderStart{left:12%;top:50%}
.board{position:absolute;z-index:5;right:7%;top:57px;width:34%;height:105px;background:#93613d;border:6px solid #4e3020;border-radius:5px;padding:7px;color:#f4d3a8;font-size:8px;line-height:1.35;box-shadow:inset 0 0 0 2px #bf8555}.board h4{margin:0 0 4px;font-size:9px;color:#f6ddb9}.board .hiddenText{color:#a57d5b;text-align:center;margin-top:28px}
.bench{position:absolute;left:5%;top:56px;color:#c29e7b;font-size:7px;text-transform:uppercase;letter-spacing:1px}
.instruction{flex:0 0 auto;background:#24170f;border:1px solid #5a3b27;border-radius:9px;padding:7px 9px;color:#cdb79c;font-size:10px;line-height:1.25}.instruction strong{color:#f5e3c4}
.message{min-height:17px;text-align:center;font-size:10px;font-weight:900}.good{color:var(--green)}.bad{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:0 0 auto}.btn{border:0;border-radius:11px;padding:10px 7px;background:#352319;color:#f8ead7;font-weight:900;font-size:12px}.primary{background:linear-gradient(#9967d5,#7146a8)}.btn:disabled{opacity:.35}
.info{background:#21150e;border:1px solid #583a26;border-radius:9px;padding:6px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #fff1;padding:4px 2px;font-size:9px;color:#a99179}.row:last-child{border:0}.row b{color:#eee0ca}
.choiceGrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{border:1px solid #593c28;border-radius:11px;background:linear-gradient(#2a1c14,#21150e);color:#f4e6d2;padding:7px;display:flex;gap:7px;align-items:center;text-align:left}.choice.selected{border:2px solid var(--gold);background:#362719}.icon{width:37px;height:43px;flex:0 0 37px;border-radius:13px 13px 9px 9px;background:linear-gradient(#ad7bdd,#674095);border:2px solid #d0afea;display:flex;align-items:flex-end;justify-content:center;font-size:17px;padding-bottom:2px;position:relative}.icon:before{content:"";position:absolute;top:-7px;width:18px;height:9px;background:#70462c;border-radius:2px}.choice b{display:block;font-size:9px}.choice span{display:block;color:#a58c75;font-size:7px;line-height:1.2;margin-top:2px}
.deliveryShop{flex:1;min-height:0;position:relative;border:4px solid #392317;border-radius:15px;overflow:hidden;background:linear-gradient(90deg,#673d26,#75482b 13%,#5b351f 25%,#75482b 27%,#61391f 43%,#78492b 45%,#5c361f 62%,#75472a 64%,#5d371f 82%,#75482b 84%,#5b351f);box-shadow:inset 0 0 45px #160904}
.deliveryWindow{position:absolute;left:6%;right:6%;top:12%;height:58%;background:#152232;border:10px solid #3c2619;box-shadow:inset 0 0 0 3px #8a5a38;overflow:hidden}.deliveryWindow .moon{top:8%}.deliveryWindow .customer{bottom:0}
.deliveryCounter{position:absolute;left:-2%;right:-2%;bottom:0;height:28%;background:linear-gradient(#8d5938,#5d3825);border-top:8px solid #3b2519;z-index:10}.deliveryTop{height:11px;background:#aa6b43;border-bottom:3px solid #44291b}
.deliveryPrompt{position:absolute;left:8%;right:8%;bottom:9%;text-align:center;color:#d5b38b;font-size:8px;letter-spacing:1px;font-weight:900}
.deliveryObject{position:absolute;z-index:30;touch-action:none;user-select:none;box-shadow:0 8px 15px #0008}.potion{width:62px;height:70px;border-radius:21px 21px 15px 15px;background:linear-gradient(#ad7dde,#674095);border:3px solid #d0b1ef;display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:24px}.potion:before{content:"";position:absolute;top:-11px;width:28px;height:16px;background:#70472d;border:2px solid #4c3024;border-radius:4px}.deliveryPaper{width:92px;height:62px;background:#f3e5c1;color:#392a20;border:2px solid #c8ad76;border-radius:7px;padding:7px;font-size:9px;font-weight:900}.bill{width:80px;background:#fff9e8;color:#392a20;border:2px solid #d4c08a;border-radius:7px;padding:7px;font-size:9px;font-weight:900}
.target{position:absolute;z-index:25;right:9%;bottom:30%;width:28%;height:23%;border:2px dashed #d0aa82;border-radius:9px;background:#20140e88;color:#d2b99b;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;padding:5px}
.tray{flex:1;min-height:0;position:relative;border:2px dashed #886543;border-radius:13px;background:radial-gradient(circle,#2d1e14,#19100b);overflow:hidden}.tray:before{content:"PAYMENT TRAY";position:absolute;top:7px;left:0;right:0;text-align:center;color:#806b58;font-size:8px;letter-spacing:1px;font-weight:900}
.coin,.herb{position:absolute;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;touch-action:none;user-select:none;box-shadow:0 7px 13px #0009}.coin{width:54px;height:54px;border-radius:50%;border:3px solid #fff3;font-size:9px}.coin10{background:radial-gradient(circle at 35% 28%,#dec677,#96792f)}.coin5{background:radial-gradient(circle at 35% 28%,#d4d4d7,#777881)}.herb{width:72px;height:49px;border-radius:10px;background:linear-gradient(#6b9b70,#3e6545);border:2px solid #8db391;font-size:8px}
.complete{height:100%;display:flex;align-items:center;justify-content:center}.completeBox{background:#21150e;border:1px solid #5b3d29;border-radius:17px;padding:22px;text-align:center;width:100%}.completeBox .big{font-size:42px}.completeBox h2{margin:5px}.completeBox p{color:#bca58b;font-size:11px;line-height:1.4}
.modal{position:fixed;inset:0;background:#080503dd;z-index:100;display:flex;align-items:flex-end;padding:12px}.sheet{width:min(600px,100%);margin:auto;background:linear-gradient(#302116,#21150f);border:1px solid #67462f;border-radius:18px;padding:17px;box-shadow:0 20px 60px #0009}.sheet h2{margin:0 0 7px}.sheet p{color:#c6ae94;font-size:12px;line-height:1.45}.sheet button{width:100%;border:0;border-radius:12px;padding:14px;background:#8d5dca;color:#fff;font-weight:900;touch-action:manipulation;cursor:pointer;position:relative;z-index:2}
@media(max-width:390px){.brand{font-size:16px}.shop,.deliveryShop{border-width:3px}.window{top:116px}.shelf{top:49px}.workspace{gap:5px}.instruction{font-size:9px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">🧪 Moonroot Apothecary<small>HANDCRAFTED POTIONS • EST. 1847</small></div><div class="money">💰 <span id="money">40</span>g</div></header>
<div class="hud"><div class="hudtop"><span class="time" id="time">7:15 AM</span><span class="phase" id="phase">Shop opening</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="screen"></div>
</div>

<script>
(()=> {
const $=id=>document.getElementById(id);
let phase=0,time=435,money=40,selected=null,drag=null,dx=0,dy=0,sorted=0,total=0;

function clock(){let h=Math.floor(time/60),m=time%60,ap=h>=720?'PM':'AM',hh=((h+11)%12)+1;$('time').textContent=`${hh}:${String(m).padStart(2,'0')} ${ap}`;$('fill').style.width=Math.max(4,Math.min(100,((time-435)/765)*100))+'%'}
function msg(t,c=''){let e=$('message');if(e){e.textContent=t;e.className='message '+c}}
function shopWindow(text){
return `<div class="shop">
 <div class="roof"><div class="sign">MOONROOT APOTHECARY</div></div>
 <div class="shelf"><i class="bottle" style="left:8%"></i><i class="bottle" style="left:22%;background:#6fae8a"></i><i class="bottle" style="left:37%;background:#d68a6e"></i><i class="bottle" style="left:54%;background:#9b70ca"></i><i class="bottle" style="left:70%;background:#d8b85d"></i><i class="bottle" style="left:84%;background:#6da2bf"></i></div>
 <div class="board" id="board"><h4>📌 DELIVERY BOARD</h4><div class="hiddenText">Orders filed here</div></div>
 <div class="window"><div class="sky"><div class="moon"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div></div><div class="speech"><b>Emily</b>${text}</div><div class="customer"><div class="head"></div><div class="torso"></div></div></div>
 <div class="counter"><div class="countertop"></div><div class="countertext">YOUR COUNTER • THE PLAY SPACE</div></div>
 </div>`
}
function makeDrag(el){
el.addEventListener('pointerdown',e=>{
 if(el.dataset.locked==='1')return;e.preventDefault();drag=el;
 const r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
 el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.transform='none';el.style.zIndex=500;
 try{el.setPointerCapture(e.pointerId)}catch{}
})}
document.addEventListener('pointermove',e=>{if(drag){drag.style.left=(e.clientX-dx)+'px';drag.style.top=(e.clientY-dy)+'px'}})
document.addEventListener('pointerup',()=>{if(drag){let e=drag;drag=null;drop(e)}})
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return !(A.right<B.left||A.left>B.right||A.bottom<B.top||A.top>B.bottom)}
function addDrag(parent,cls,html){let e=document.createElement('div');e.className=cls;e.innerHTML=html;$(parent).appendChild(e);makeDrag(e);return e}
function shell(c){$('screen').innerHTML=`<div class="view">${c}</div>`}
function reset(){location.reload()}

function renderOrder(){
phase=1;$('phase').textContent='Step 1 • File the order';
shell(`<div class="kicker">Step 1 of 4 • Customer at the service window</div>
${shopWindow(`“I’ve been having terrible trouble sleeping. My head just won’t quiet down. I’ll come back at <b>8:00 PM</b>.”`)}
<div class="instruction"><strong>📜 Emily left an order on your counter.</strong> Drag the paper upward to the Delivery Board. Nothing else is a menu. The wooden counter is your play space.</div>
<div class="message" id="message"></div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Continue</button></div>`);
let o=addDrag('counter','counterItem paper orderStart','📜 ORDER #12<small>Emily • 8:00 PM</small>');o.dataset.kind='order';
$('reset').onclick=reset;$('advance').onclick=renderChoice;msg('Drag the paper order to the board.')
}
function renderChoice(){
phase=2;$('phase').textContent='Step 2 • Solve the order';
shell(`<div class="kicker">Step 2 of 4 • Choose what Emily needs</div>
${shopWindow(`“Please help me sleep. My thoughts won’t stop racing.”`)}
<div class="info"><div class="row"><span>Customer</span><b>Emily</b></div><div class="row"><span>Return</span><b>8:00 PM</b></div><div class="row"><span>Problem</span><b>Can't sleep • racing thoughts</b></div></div>
<div class="instruction"><strong>🧠 Read the problem, then choose a remedy.</strong> Emily never gives you the potion name.</div>
<div class="choiceGrid">
<button class="choice" data-p="dream"><div class="icon">🧪</div><div><b>Dreamer’s Rest</b><span>Calms racing thoughts and aids sleep.</span></div></button>
<button class="choice" data-p="sun"><div class="icon" style="background:linear-gradient(#e0b858,#9d682b)">☀️</div><div><b>Sunwake Elixir</b><span>Restores alertness and energy.</span></div></button>
<button class="choice" data-p="mender"><div class="icon" style="background:linear-gradient(#dc7694,#913e5d)">💗</div><div><b>Mender’s Draught</b><span>Soothes aches and bruises.</span></div></button>
<button class="choice" data-p="iron"><div class="icon" style="background:linear-gradient(#79a76b,#416047)">🌿</div><div><b>Ironbark Tonic</b><span>Strengthens the body against weakness.</span></div></button>
</div><div class="message" id="message"></div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="choose" disabled>Prepare Potion</button></div>`);
$('reset').onclick=reset;
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.p;$('choose').disabled=false;msg(selected==='dream'?'That matches Emily’s symptoms.':'That remedy doesn’t match her problem.')});
$('choose').onclick=()=>selected==='dream'?renderReady():msg('Choose the remedy for sleeplessness and racing thoughts.','bad')
}
function renderReady(){
phase=2;$('phase').textContent='Step 2 • Potion ready';
shell(`<div class="kicker">Order #12 • Waiting for 8:00 PM</div>
${shopWindow(`“I’ll come back at <b>8:00 PM</b>. Thank you.”`)}
<div class="instruction"><strong>🧪 Dreamer’s Rest is prepared.</strong> It is sitting on your counter. Advance time to when Emily returns.</div>
<div class="message good" id="message">The order is ready.</div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance">Advance to 8:00 PM</button></div>`);
$('reset').onclick=reset;$('advance').onclick=()=>{time=1200;clock();renderDelivery()}
}
function renderDelivery(){
phase=3;$('phase').textContent='Step 3 • Serve through window';
$('screen').innerHTML=`<div class="view"><div class="kicker">Step 3 of 4 • Emily has returned</div>
<div class="deliveryShop"><div class="deliveryWindow"><div class="sky"><div class="moon"></div><div class="tree t1"></div><div class="tree t2"></div><div class="tree t3"></div></div><div class="speech"><b>Emily</b>“Hi! I hope you made something to help.”</div><div class="customer"><div class="head"></div><div class="torso"></div></div></div>
<div class="target" id="target">PASS THE NEXT ITEM<br>THROUGH THE WINDOW</div><div class="deliveryCounter"><div class="deliveryTop"></div><div class="deliveryPrompt">YOUR COUNTER • DRAG ITEMS TO EMILY</div></div></div>
<div class="instruction"><strong>📦 Deliver through the window:</strong> ① Potion → ② Order → ③ Bill. The objects are physically on your counter.</div>
<div class="message" id="message"></div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Continue</button></div></div>`;
$('reset').onclick=reset;
let p=addDrag('deliveryShop','deliveryObject potion','🧪');p.dataset.kind='potion';p.style.left='13%';p.style.top='70%';
let o=addDrag('deliveryShop','deliveryObject deliveryPaper','📜<br>ORDER #12');o.dataset.kind='order';o.style.left='43%';o.style.top='70%';
let b=addDrag('deliveryShop','deliveryObject bill','BILL<br>25g');b.dataset.kind='bill';b.style.left='69%';b.style.top='72%';
msg('① Drag the potion through the window to Emily.')
}
function renderPayment(){
phase=4;$('phase').textContent='Step 4 • Sort payment';
$('screen').innerHTML=`<div class="view"><div class="kicker">Step 4 of 4 • Payment lands on the counter</div>
${shopWindow(`“Thank you! Here’s your payment.”`)}
<div class="instruction"><strong>🪙 Emily placed four payment pieces on your counter.</strong> Drag every piece into the wooden payment tray below. Coins become gold; Silverleaf becomes an item.</div>
<div class="tray" id="tray"></div><div class="message" id="message"></div><div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="finish" disabled>Finish Sale</button></div></div>`;
$('reset').onclick=reset;
[['coin coin10','10g',10],['coin coin10','10g',10],['coin coin5','5g',5],['herb','🌿<br>Silverleaf',0]].forEach((a,i)=>{let e=addDrag('tray','counterItem '+a[0],a[1]);e.dataset.pay=1;e.dataset.value=a[2];e.style.position='absolute';e.style.left=(8+i*23)+'%';e.style.top='46%'});
msg('Sort all four payment pieces into the tray.')
}
function renderComplete(){
$('phase').textContent='Sale complete';
shell(`<div class="complete"><div class="completeBox"><div class="big">🌙✨</div><h2>Sale Complete</h2><p>Emily received her potion through the service window and left happy.</p><div class="info"><div class="row"><span>Gold earned</span><b>+25g</b></div><div class="row"><span>Item received</span><b>🌿 Silverleaf ×1</b></div></div><p>The shop is ready for the next customer.</p><button class="btn primary" id="reset" style="width:100%">Run Sale Again</button></div></div>`);$('reset').onclick=reset
}
function drop(el){
if(phase===1&&el.dataset.kind==='order'&&hit(el,$('board'))){el.remove();$('board').innerHTML='<h4>📌 DELIVERY BOARD</h4><div class="board"><b>ORDER #12 • EMILY</b><br>Return: 8:00 PM<br><br>“I can’t sleep. My head just won’t quiet down.”</div>';msg('Order filed ✓ Now solve Emily’s problem.','good');$('advance').disabled=false;return}
if(phase===3&&el.dataset.kind&&hit(el,$('target'))){
let needed=['potion','order','bill'][document.querySelectorAll('[data-locked="1"]').length];
if(el.dataset.kind!==needed){msg('Not yet. Deliver Potion → Order → Bill.','bad');return}
el.dataset.locked='1';el.style.position='relative';el.style.left='auto';el.style.top='auto';el.style.margin='3px';el.style.width=needed==='potion'?'45px':needed==='order'?'75px':'68px';$('target').appendChild(el);
if(needed==='potion')msg('Potion delivered ✓ Now pass the order.','good');
if(needed==='order')msg('Order delivered ✓ Now pass the bill.','good');
if(needed==='bill'){msg('Everything delivered ✓ Emily pays.','good');$('advance').disabled=false}
return}
if(phase===4&&el.dataset.pay&&hit(el,$('tray'))){
el.dataset.locked='1';el.style.position='relative';el.style.left='auto';el.style.top='auto';el.style.margin='4px';$('tray').appendChild(el);sorted++;total+=Number(el.dataset.value);
if(sorted===4){money+=total;$('money').textContent=money;$('finish').disabled=false;msg('All payment sorted ✓ +25g added to your purse.','good')}else msg(`${4-sorted} payment piece${4-sorted===1?'':'s'} left.`,'good')
}}
document.addEventListener('click',e=>{
  if(e.target.id==='advance'&&phase===3) renderPayment();
  if(e.target.id==='finish'&&phase===4&&sorted===4) renderComplete();
});
renderOrder();
clock();
})();
</script>
