<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#120e18">
<title>Moonroot Apothecary</title>
<style>
:root{
 --bg:#120e18;--panel:#201927;--panel2:#2b2136;--line:#4a3a58;--soft:#6c597d;
 --text:#faf5ff;--muted:#b9adca;--purple:#9562da;--purple2:#6d439f;
 --gold:#f2ca62;--green:#83e09a;--red:#ff8495;--paper:#f7ebca;--ink:#3b3028;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% -10%,#30203e 0,#120e18 48%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;touch-action:none}
body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
button{font:inherit}
#app{height:100%;width:min(100%,620px);margin:auto;display:flex;flex-direction:column}
header{height:51px;flex:0 0 51px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;font-size:19px;letter-spacing:-.2px}.brand span{font-size:21px}
.money{display:flex;gap:5px;align-items:center;color:var(--gold);font-weight:900;background:linear-gradient(#382d1c,#2c2317);border:1px solid #65512a;border-radius:999px;padding:7px 11px}
.hud{flex:0 0 55px;background:linear-gradient(145deg,#261d31,#1d1726);border:1px solid var(--line);border-radius:15px;padding:8px 11px;margin-bottom:8px;box-shadow:0 7px 20px #0003}
.hudtop{display:flex;justify-content:space-between;align-items:center}.time{font-size:17px;font-weight:900}.phase{font-size:11px;color:#c7bad2}.bar{height:5px;background:#100c14;border-radius:99px;margin-top:7px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7145a8,#b987f0);border-radius:99px;transition:width .35s}
#screen{flex:1;min-height:0;position:relative}
.view{height:100%;display:flex;flex-direction:column;gap:8px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#bda8d0;font-weight:900}
.panel{background:linear-gradient(145deg,#241c2e,#1d1725);border:1px solid var(--line);border-radius:18px;padding:11px;box-shadow:0 8px 22px #0002}
.customer{display:flex;gap:10px;align-items:center;min-height:88px}
.avatar{width:57px;height:57px;flex:0 0 57px;border-radius:50%;background:linear-gradient(#e2a97d,#c67f59);border:4px solid #55363a;position:relative;box-shadow:inset 0 5px 8px #fff2}
.avatar:before{content:"";position:absolute;left:5px;top:-6px;width:45px;height:25px;border-radius:50%;background:#4b2931}
.speech{flex:1;background:#faf4ff;color:#302737;border-radius:14px;padding:9px 11px;font-size:12px;line-height:1.35;box-shadow:0 4px 10px #0002}.speech b{display:block;margin-bottom:3px}
.objective{font-size:13px;line-height:1.35;background:linear-gradient(145deg,#30233e,#241b30);border-color:#5d4770}
.objective strong{color:#fff}.gold{color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.dropzone{position:relative;min-height:0;border:2px dashed #5a4967;border-radius:17px;background:#18131e;padding:10px;overflow:hidden}
.dropzone.active{border-color:#9b70d9;background:linear-gradient(145deg,#231a2f,#1b1524)}
.dropzone h3{margin:0 0 4px;font-size:13px}.dropzone p{margin:0;color:var(--muted);font-size:10px;line-height:1.35}
.centerhint{position:absolute;left:10px;right:10px;bottom:12px;text-align:center;color:#82758d;font-size:10px}
.board{height:100%;background:linear-gradient(145deg,#a8754a,#855a3c);border:6px solid #553629;border-radius:9px;color:#f7d8af;padding:10px;box-shadow:inset 0 0 0 2px #c28d5e,0 7px 12px #0004;font-size:11px;line-height:1.42}
.board b{font-size:13px}.pin{display:inline-block;width:8px;height:8px;background:#cc5962;border-radius:50%;box-shadow:0 1px 2px #0006;margin-right:5px}
.paper{position:absolute;z-index:20;width:120px;height:82px;background:var(--paper);color:var(--ink);border:2px solid #d2bb8a;border-radius:10px;padding:9px;box-shadow:0 9px 18px #0006;font-size:12px;font-weight:900;touch-action:none;user-select:none}
.paper small{display:block;font-size:10px;font-weight:600;margin-top:4px}.paper.start{left:50%;top:52%;transform:translate(-50%,-50%)}
.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;flex:1;min-height:0}
.potionChoice{border:1px solid var(--line);background:linear-gradient(145deg,#292034,#211a2b);border-radius:15px;padding:10px;text-align:left;color:var(--text);min-height:0;display:flex;gap:9px;align-items:center}
.potionIcon{width:45px;height:50px;flex:0 0 45px;border-radius:16px 16px 12px 12px;background:linear-gradient(#ad7cdf,#684097);border:2px solid #d0b0ef;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;font-size:20px;position:relative}.potionIcon:before{content:"";position:absolute;top:-8px;width:22px;height:11px;background:#70482f;border-radius:3px;border:1px solid #4c3024}
.potionChoice b{display:block;font-size:12px}.potionChoice span{display:block;color:var(--muted);font-size:9px;line-height:1.25;margin-top:2px}
.potionChoice.selected{border:2px solid var(--gold);background:#342b21}.potionChoice:active{transform:scale(.98)}
.infoRow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);padding:7px 0;border-bottom:1px solid #ffffff0c}.infoRow:last-child{border-bottom:0}.infoRow b{color:#fff}
.deliveryGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0}
.items,.recipient{position:relative;min-height:0;border-radius:17px;padding:10px}.items{background:#18131e;border:2px dashed #5a4967}.recipient{background:linear-gradient(145deg,#292037,#21192c);border:2px solid #8060a5}
.miniCustomer{display:flex;align-items:center;gap:7px;margin-bottom:7px}.miniCustomer .avatar{width:42px;height:42px;flex-basis:42px}.miniCustomer .avatar:before{width:34px;height:18px}
.target{height:calc(100% - 53px);border:2px dashed #b58adf;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#c7b6d3;font-size:11px;padding:9px;transition:.2s}
.target.ready{border-color:var(--gold);box-shadow:inset 0 0 25px #f2ca6210}
.draggable{position:absolute;z-index:30;touch-action:none;user-select:none;box-shadow:0 8px 16px #0006}
.potion{width:70px;height:78px;border-radius:24px 24px 18px 18px;background:linear-gradient(#ae7dde,#684097);border:3px solid #d0b1ef;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:26px}.potion:before{content:"";position:absolute;top:-12px;width:31px;height:17px;background:#70482f;border:2px solid #4c3024;border-radius:5px}
.deliveryPaper{width:105px;min-height:68px;background:var(--paper);color:var(--ink);border:2px solid #d2bb8a;border-radius:9px;padding:8px;font-size:11px;font-weight:900}
.bill{width:88px;background:#fff9e8;color:var(--ink);border:2px solid #d5c28c;border-radius:9px;padding:8px;font-size:11px;font-weight:900}
.paymentHeader{font-size:13px;line-height:1.35;color:var(--muted)}.paymentHeader b{color:#fff}
.tray{position:relative;flex:1;min-height:0;border:2px dashed #9873bf;border-radius:18px;background:radial-gradient(circle at 50% 40%,#251c30,#17121c);overflow:hidden}
.tray:before{content:"PAYMENT TRAY";position:absolute;left:0;right:0;top:8px;text-align:center;font-size:10px;letter-spacing:1px;color:#766a80;font-weight:900}
.coin,.herb{position:absolute;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;touch-action:none;user-select:none;box-shadow:0 7px 14px #0007}
.coin{width:60px;height:60px;border-radius:50%;border:3px solid #ffffff35;font-size:11px}.coin10{background:radial-gradient(circle at 35% 30%,#ddc477,#9b7d36)}.coin5{background:radial-gradient(circle at 35% 30%,#d0d0d5,#777881)}
.herb{width:78px;height:54px;border-radius:12px;background:linear-gradient(#67956c,#3e6746);border:2px solid #8db692;font-size:10px}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat{background:#1a151f;border:1px solid #3e324a;border-radius:12px;padding:8px;text-align:center}.stat b{display:block;font-size:16px}.stat span{font-size:9px;color:var(--muted)}
.message{min-height:22px;text-align:center;font-size:12px;font-weight:800;padding:1px}.good{color:var(--green)}.bad{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:14px;padding:12px 8px;background:#34283f;color:#fff;font-weight:900}.btn.primary{background:linear-gradient(#9864dc,#7448ae)}.btn:disabled{opacity:.35}
.modal{position:fixed;inset:0;background:#07040ccc;z-index:100;display:flex;align-items:flex-end;padding:14px}.sheet{width:min(600px,100%);margin:auto;background:linear-gradient(145deg,#291f35,#1d1726);border:1px solid #5a466d;border-radius:22px;padding:18px;box-shadow:0 20px 60px #0008}.sheet h2{margin:0 0 7px;font-size:22px}.sheet p{color:#c9bed3;font-size:13px;line-height:1.45}.sheet button{width:100%;border:0;border-radius:14px;padding:14px;background:var(--purple);color:#fff;font-weight:900}
.complete{height:100%;display:flex;align-items:center;justify-content:center}.completeBox{text-align:center;background:linear-gradient(145deg,#292034,#1d1726);border:1px solid var(--line);border-radius:22px;padding:24px;width:100%}.completeBox .big{font-size:44px}.completeBox h2{margin:4px 0 8px}.completeBox p{color:var(--muted);font-size:13px;line-height:1.4}
.hidden{display:none!important}
@media(max-width:390px){.brand{font-size:17px}.hud{margin-bottom:6px}.customer{min-height:80px}.speech{font-size:11px}.grid2,.deliveryGrid{gap:6px}.panel{padding:9px}.potionChoice{padding:7px}.potionChoice span{font-size:8px}.paper{width:112px}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand"><span>🧪</span> Moonroot Apothecary</div><div class="money">💰 <span id="money">40</span>g</div></header>
<div class="hud"><div class="hudtop"><span class="time" id="time">7:15 AM</span><span class="phase" id="phase">New customer</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
<div id="screen"></div>
</div>
<div class="modal" id="modal"><div class="sheet"><h2>🪻 A new customer is waiting</h2><p>Read the customer's problem carefully. Their order will not tell you the potion name. You must figure out what they need, file the order, and have the correct potion ready when they return.</p><button id="start">Open the shop</button></div></div>

<script>
(() => {
const $=id=>document.getElementById(id);
let phase=0,time=435,money=40,selected=null,drag=null,dx=0,dy=0,sorted=0,total=0;

const potions=[
 {id:'dream',name:"Dreamer's Rest",icon:'🧪',desc:'Calms racing thoughts and helps with sleep.'},
 {id:'sun',name:'Sunwake Elixir',icon:'☀️',desc:'Restores alertness and fights exhaustion.'},
 {id:'mender',name:"Mender's Draught",icon:'💗',desc:'Soothes aches, bruises, and minor injuries.'},
 {id:'iron',name:'Ironbark Tonic',icon:'🌿',desc:'Strengthens the body and wards off weakness.'}
];

function clock(){let h=Math.floor(time/60),m=time%60,ap=h>=720?'PM':'AM',hh=((h+11)%12)+1;$('time').textContent=`${hh}:${String(m).padStart(2,'0')} ${ap}`;$('fill').style.width=Math.max(4,Math.min(100,((time-435)/765)*100))+'%';}
function msg(t,c=''){let e=$('message');if(e){e.textContent=t;e.className='message '+c}}
function customer(text){return `<div class="panel customer"><div class="avatar"></div><div class="speech"><b>Emily</b>${text}</div></div>`}
function buttonEvents(){ $('reset').onclick=reset; }
function makeDrag(el){
 el.addEventListener('pointerdown',e=>{
   if(el.dataset.locked==='1')return;
   e.preventDefault();drag=el;
   const r=el.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
   el.dataset.parent=el.parentElement.id||'';el.dataset.oldLeft=el.style.left;el.dataset.oldTop=el.style.top;
   el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.transform='none';el.style.zIndex=200;
   try{el.setPointerCapture(e.pointerId)}catch{}
 });
}
document.addEventListener('pointermove',e=>{if(!drag)return;drag.style.left=(e.clientX-dx)+'px';drag.style.top=(e.clientY-dy)+'px'});
document.addEventListener('pointerup',()=>{if(drag){let e=drag;drag=null;drop(e)}});
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return !(A.right<B.left||A.left>B.right||A.bottom<B.top||A.top>B.bottom)}
function addDrag(parent,cls,html){let e=document.createElement('div');e.className=cls;e.innerHTML=html;$(parent).appendChild(e);makeDrag(e);return e}

function renderOrder(){
 phase=1;selected=null;
 $('phase').textContent='Step 1 • File the order';
 $('screen').innerHTML=`<div class="view">
  <div class="kicker">Step 1 of 4 • Understand the customer</div>
  ${customer(`“I’ve been having terrible trouble sleeping. My head just won’t quiet down. I’ll come back at <b>8:00 PM</b>.”`)}
  <div class="panel objective"><strong>📌 Your task</strong><br>Drag Emily's paper order from the counter to the Delivery Board.</div>
  <div class="grid2">
   <div class="dropzone active" id="counter"><h3>Your Counter</h3><p>Orders left by customers appear here.</p></div>
   <div class="dropzone" id="board"><h3>Delivery Board</h3><div class="centerhint">Drop the order here</div></div>
  </div>
  <div class="message" id="message"></div>
  <div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Continue</button></div>
 </div>`;
 let o=addDrag('counter','paper start','📜 ORDER #12<small>Emily • Return 8:00 PM</small>');o.dataset.kind='order';
 buttonEvents();$('advance').onclick=()=>renderChoice();
 msg('Drag the paper to the Delivery Board.');
}
function renderChoice(){
 phase=2;$('phase').textContent='Step 2 • Choose the potion';
 $('screen').innerHTML=`<div class="view">
  <div class="kicker">Step 2 of 4 • Read the filed order</div>
  ${customer(`“I’ll be back at <b>8:00 PM</b>. Please have something ready.”`)}
  <div class="panel">
   <div class="infoRow"><span>Customer</span><b>Emily</b></div>
   <div class="infoRow"><span>Return time</span><b>8:00 PM</b></div>
   <div class="infoRow"><span>Problem</span><b>Can't sleep / racing thoughts</b></div>
  </div>
  <div class="panel objective"><strong>🧠 What does she need?</strong><br>Choose the potion that best solves her problem. The customer never tells you the potion name.</div>
  <div class="choiceGrid">${potions.map(p=>`<button class="potionChoice" data-potion="${p.id}"><div class="potionIcon">${p.icon}</div><div><b>${p.name}</b><span>${p.desc}</span></div></button>`).join('')}</div>
  <div class="message" id="message"></div>
  <div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="choose" disabled>Prepare potion</button></div>
 </div>`;
 buttonEvents();
 document.querySelectorAll('.potionChoice').forEach(b=>b.onclick=()=>{
   document.querySelectorAll('.potionChoice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.potion;$('choose').disabled=false;
   msg(selected==='dream'?'That fits the symptoms. Dreamer’s Rest should do the job.':'That may not solve Emily’s problem. Choose based on her symptoms.','');
 });
 $('choose').onclick=()=>{
   if(selected!=='dream'){msg('That potion does not match Emily’s problem. Try again.','bad');return}
   renderReady();
 };
}
function renderReady(){
 phase=2;$('phase').textContent='Step 2 • Potion prepared';
 $('screen').innerHTML=`<div class="view">
  <div class="kicker">Order #12 • Ready for pickup</div>
  ${customer(`“See you at <b>8:00 PM</b>.”`)}
  <div class="panel objective"><strong>🧪 Dreamer's Rest selected</strong><br>Emily returns at 8:00 PM. The potion is ready for delivery.</div>
  <div class="panel" style="flex:1;display:flex;align-items:center;justify-content:center;text-align:center"><div><div style="font-size:70px">🧪</div><b>Dreamer's Rest</b><br><span style="color:var(--muted);font-size:12px">Prepared and waiting on the counter</span></div></div>
  <div class="message good" id="message">Everything is ready. Advance time to Emily's return.</div>
  <div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance">Advance to 8 PM</button></div>
 </div>`;
 buttonEvents();$('advance').onclick=()=>{time=1200;clock();renderDelivery()};
}
function renderDelivery(){
 phase=3;$('phase').textContent='Step 3 • Serve Emily';
 $('screen').innerHTML=`<div class="view">
  <div class="kicker">Step 3 of 4 • Customer returned</div>
  ${customer(`“Hi! I hope you made something to help.”`)}
  <div class="panel objective"><strong>📦 Deliver in this exact order:</strong> ① Potion → ② Order → ③ Bill</div>
  <div class="deliveryGrid">
   <div class="items" id="items"><h3>Your Items</h3><p>Drag each item to Emily.</p></div>
   <div class="recipient"><div class="miniCustomer"><div class="avatar"></div><b>Emily</b></div><div class="target" id="target">Drop the next item here</div></div>
  </div>
  <div class="message" id="message"></div>
  <div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="advance" disabled>Finish delivery</button></div>
 </div>`;
 buttonEvents();
 let p=addDrag('items','draggable potion','🧪');p.dataset.kind='potion';p.style.left='15%';p.style.top='48%';
 let o=addDrag('items','draggable deliveryPaper','📜<br>ORDER #12');o.dataset.kind='order';o.style.left='48%';o.style.top='47%';
 let b=addDrag('items','draggable bill','BILL<br>25g');b.dataset.kind='bill';b.style.left='28%';b.style.top='72%';
 msg('① Drag the potion to Emily.');
}
function renderPayment(){
 phase=4;$('phase').textContent='Step 4 • Sort payment';
 $('screen').innerHTML=`<div class="view">
  <div class="kicker">Step 4 of 4 • Payment</div>
  ${customer(`“Thank you! I’ve brought your payment.”`)}
  <div class="panel paymentHeader"><b>Emily paid with four pieces.</b> Sort every piece into the payment tray. Coins become gold. The herb bundle becomes an inventory item.</div>
  <div class="tray" id="tray"></div>
  <div class="summary"><div class="stat"><b id="sortCount">0 / 4</b><span>pieces sorted</span></div><div class="stat"><b id="sortGold">0g</b><span>gold collected</span></div></div>
  <div class="message" id="message"></div>
  <div class="actions"><button class="btn" id="reset">Reset</button><button class="btn primary" id="finish" disabled>Finish Sale</button></div>
 </div>`;
 buttonEvents();
 [['coin coin10','10g',10],['coin coin10','10g',10],['coin coin5','5g',5],['herb','🌿<br>Silverleaf',0]].forEach((a,i)=>{
   let e=addDrag('tray','draggable '+a[0],a[1]);e.dataset.pay='1';e.dataset.value=a[2];e.style.position='absolute';e.style.left=(7+i*23)+'%';e.style.top='48%';
 });
 msg('Sort all four pieces into the tray.');
}
function renderComplete(){
 $('phase').textContent='Sale complete';
 $('screen').innerHTML=`<div class="complete"><div class="completeBox"><div class="big">✨</div><h2>Sale Complete</h2><p>Emily received the right potion, her order, and her bill.</p><div class="summary"><div class="stat"><b>+25g</b><span>earned</span></div><div class="stat"><b>🌿 1</b><span>Silverleaf kept</span></div></div><p style="margin-top:14px">The shop is ready for the next customer.</p><button class="btn primary" id="reset" style="width:100%">Run the Sale Again</button></div></div>`;$('reset').onclick=reset;
}
function drop(el){
 if(phase===1&&el.dataset.kind==='order'&&hit(el,$('board'))){
   el.remove();let board=$('board');board.innerHTML='<h3>Delivery Board</h3><div class="board"><span class="pin"></span><b>ORDER #12 • EMILY</b><br>Return: 8:00 PM<br><br>“I can’t sleep. My head just won’t quiet down.”</div>';msg('Order filed ✓ Now figure out which potion solves the problem.','good');$('advance').disabled=false;return;
 }
 if(phase===3&&el.dataset.kind&&hit(el,$('target'))){
   let needed=['potion','order','bill'][document.querySelectorAll('.delivered').length];
   if(el.dataset.kind!==needed){msg('Not yet. Follow the order: Potion → Order → Bill.','bad');return}
   el.dataset.locked='1';el.classList.add('delivered');$('target').appendChild(el);
   if(needed==='potion')msg('Potion delivered ✓ Now deliver the order.','good');
   if(needed==='order')msg('Order delivered ✓ Now deliver the bill.','good');
   if(needed==='bill'){msg('Everything delivered ✓ Emily pays.','good');$('advance').disabled=false}
   return;
 }
 if(phase===4&&el.dataset.pay&&hit(el,$('tray'))){
   el.dataset.locked='1';el.style.position='relative';el.style.left='auto';el.style.top='auto';el.style.margin='5px';$('tray').appendChild(el);
   sorted++;total+=Number(el.dataset.value);$('sortCount').textContent=`${sorted} / 4`;$('sortGold').textContent=total+'g';
   if(sorted===4){money+=total;$('money').textContent=money;$('finish').disabled=false;msg('All payment sorted ✓ 25g added to your purse.','good')}
   else msg(`${4-sorted} payment piece${4-sorted===1?'':'s'} left.`,'good');
 }
}
function reset(){phase=0;time=435;money=40;selected=null;sorted=0;total=0;$('money').textContent=money;clock();$('modal').classList.remove('hidden');renderOrder()}
$('start').onclick=()=>{$('modal').classList.add('hidden');renderOrder();clock()};
document.addEventListener('click',e=>{if(e.target.id==='advance'&&phase===3)renderPayment();if(e.target.id==='finish'&&phase===4&&sorted===4)renderComplete()});
renderOrder();clock();
})();
</script>
</body>
</html>
